# Tests automáticos: se ejecutan en cada cambio a main y en cada pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (H2 y PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: prepadel
          POSTGRES_USER: prepadel
          POSTGRES_PASSWORD: prepadel-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U prepadel -d prepadel"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Tests con H2 (como en desarrollo)
        run: ./mvnw -B -ntp verify
      # Los mismos tests contra PostgreSQL, que es la base de datos de producción:
      # así una migración que solo funcione en H2 no llega a desplegarse.
      - name: Tests con PostgreSQL (como en producción)
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/prepadel
          SPRING_DATASOURCE_USERNAME: prepadel
          SPRING_DATASOURCE_PASSWORD: prepadel-ci
        run: ./mvnw -B -ntp test

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Tests
        run: npm test
      - name: Tipos y build de producción
        run: npm run build

  image:
    name: Imagen Docker
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - name: Construir la imagen de producción
        run: docker build -t prepadel .
