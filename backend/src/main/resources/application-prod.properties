# Perfil de produccion. Se activa con SPRING_PROFILES_ACTIVE=prod (la imagen Docker ya lo hace).
#
# La base de datos es PostgreSQL y llega por variables de entorno. Si falta alguna,
# la app no arranca: mejor eso que guardar datos de jugadores en un fichero que se
# pierde en el siguiente despliegue.
#   DATABASE_JDBC_URL   jdbc:postgresql://servidor:5432/prepadel
#   DATABASE_USER
#   DATABASE_PASSWORD
spring.datasource.url=${DATABASE_JDBC_URL}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}
# Los planes pequenos de PostgreSQL admiten pocas conexiones.
spring.datasource.hikari.maximum-pool-size=5

# El alojamiento suele indicar el puerto en PORT y poner su proxy HTTPS por delante.
server.port=${PORT:8080}
server.forward-headers-strategy=native

# La web y la API viajan comprimidas.
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,text/javascript,application/javascript,application/json,application/manifest+json,image/svg+xml
