spring.application.name=prepadel
server.port=8080

# Base de datos local: fichero H2 en backend/data (no se sube a git).
# El SQL de las migraciones es compatible con PostgreSQL para el paso a produccion.
spring.datasource.url=jdbc:h2:file:./data/prepadel;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=

# Flyway es el dueno del esquema (src/main/resources/db/migration).
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Errores en formato estandar application/problem+json
spring.mvc.problemdetails.enabled=true

# Regla "si el dolor supera X o dura mas de Y dias, consulta".
# Valores provisionales: los debe confirmar el fisioterapeuta que valide el contenido.
prepadel.pain.consult-score=7
prepadel.pain.persistent-score=4
prepadel.pain.persistent-days=10

# Tope de jugadores nuevos por conexion (IP) y hora en POST /api/players.
# Holgado a proposito: en un club varios jugadores comparten la misma wifi.
prepadel.rate-limit.registrations-per-hour=20

# Panel de retencion en /api/admin/panel. Vacio = el panel no existe (404).
# En produccion se pone con la variable de entorno PREPADEL_ADMIN_PASSWORD (larga y aleatoria).
prepadel.admin.password=

# Pantalla /revision donde el fisioterapeuta aprueba el contenido. Vacio = no existe (404).
# En produccion: PREPADEL_REVIEW_PASSWORD, distinta de la del panel; se la das al fisio.
prepadel.review.password=

# Aviso del partido con la app cerrada (Web Push). Sin estas tres, la app solo avisa abierta.
# Claves VAPID: se generan una vez con "npx web-push generate-vapid-keys" y no se cambian
# (cambiarlas invalida las suscripciones). En produccion: PREPADEL_PUSH_PUBLIC_KEY,
# PREPADEL_PUSH_PRIVATE_KEY y PREPADEL_PUSH_SUBJECT (mailto:tu-correo o https://tu-dominio).
prepadel.push.public-key=
prepadel.push.private-key=
prepadel.push.subject=
