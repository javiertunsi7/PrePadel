# Los tests usan una base de datos en memoria: mismas migraciones, datos desechables.
spring.datasource.url=jdbc:h2:mem:prepadel;MODE=PostgreSQL;DB_CLOSE_DELAY=-1

# Los tests crean muchos jugadores desde la misma direccion: el tope se prueba aparte.
prepadel.rate-limit.registrations-per-hour=100000
