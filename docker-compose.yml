# PrePádel como en producción, pero en tu equipo: la imagen real y un PostgreSQL.
#
#   docker compose up --build      y abre http://localhost:8090
#   docker compose down            para pararlo (los datos se conservan)
#   docker compose down --volumes  para pararlo y borrar la base de datos
#
# El puerto 8090 evita chocar con el backend de desarrollo (8080).

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: prepadel
      POSTGRES_USER: prepadel
      # Contraseña solo para esta base de datos local de pruebas. En producción
      # la pone el alojamiento y nunca se guarda en el repositorio.
      POSTGRES_PASSWORD: prepadel-local
    volumes:
      - prepadel-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prepadel -d prepadel"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_JDBC_URL: jdbc:postgresql://db:5432/prepadel
      DATABASE_USER: prepadel
      DATABASE_PASSWORD: prepadel-local
      # Panel de retención en /api/admin/panel; vacío = no existe.
      PREPADEL_ADMIN_PASSWORD: ${PREPADEL_ADMIN_PASSWORD:-}
      # Pantalla /revision del fisio; vacía = no existe.
      PREPADEL_REVIEW_PASSWORD: ${PREPADEL_REVIEW_PASSWORD:-}
      # Aviso del partido con la app cerrada; vacías = solo avisa con la app abierta.
      PREPADEL_PUSH_PUBLIC_KEY: ${PREPADEL_PUSH_PUBLIC_KEY:-}
      PREPADEL_PUSH_PRIVATE_KEY: ${PREPADEL_PUSH_PRIVATE_KEY:-}
      PREPADEL_PUSH_SUBJECT: ${PREPADEL_PUSH_SUBJECT:-}
    ports:
      - "8090:8080"

volumes:
  prepadel-db:
